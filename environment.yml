name: ef2039-pa04
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch picks the best device at runtime: CUDA GPU > Apple MPS > CPU.
      # On Linux, the default torch wheel ships with CUDA support.
      - torch==2.5.1
      - torchvision==0.20.1
      - numpy==1.26.4
      - opencv-python==4.10.0.84
      - scipy==1.14.1        # 1.15.x wheels fail to load on recent macOS
      - scikit-learn==1.5.2
      - pandas==2.2.3
      - matplotlib==3.9.2
      - pyyaml==6.0.2
